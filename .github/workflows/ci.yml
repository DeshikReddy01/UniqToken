name: Caliper Tokenizer CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[test,bench,huggingface]"

      - name: Lint
        run: ruff check .

      - name: Verify Formatting
        run: ruff format --check .

      - name: Type Check
        run: python -m mypy .

      - name: Run Full Test Suite (Unit & Property Fuzzing)
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Run Empirical Benchmark Suite Smoke Test
        run: |
          python benchmarks/benchmark_suite.py

      - name: Verify Package Build
        run: |
          python -m build
