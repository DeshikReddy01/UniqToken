name: Caliper Tokenizer CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust core
        run: cargo check --manifest-path caliper_core/Cargo.toml --all-targets

      - name: Lint Rust core
        run: cargo clippy --manifest-path caliper_core/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build & Test Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install ruff mypy pytest coverage tokenizers transformers sentencepiece

      - name: Install Caliper Tokenizer (Editable)
        run: |
          python -m pip install -e .

      - name: Lint (Ruff)
        run: |
          python -m ruff check .

      - name: Formatting (Ruff)
        run: |
          python -m ruff format --check .

      - name: Type Check (Mypy)
        run: |
          python -m mypy .

      - name: Run Full Test Suite (Unit & Property Fuzzing)
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Run Empirical Benchmark Suite Smoke Test
        run: |
          python benchmarks/benchmark_suite.py

      - name: Verify Package Build
        run: |
          python -m build
