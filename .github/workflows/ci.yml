name: Caliper Tokenizer CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust core
        run: cargo check --manifest-path caliper_core/Cargo.toml --all-targets

      - name: Lint Rust core
        run: cargo clippy --manifest-path caliper_core/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build & Test Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install ruff mypy pytest coverage maturin regex tokenizers transformers sentencepiece

      - name: Build & Install Native Extension (fresh from source)
        run: |
          python -m pip install ./caliper_core

      - name: Install Caliper Tokenizer (Editable)
        run: |
          python -m pip install -e .

      - name: Lint (Ruff)
        run: |
          python -m ruff check .

      - name: Formatting (Ruff)
        run: |
          python -m ruff format --check .

      - name: Type Check (Mypy)
        run: |
          python -m mypy .

      - name: Run Full Test Suite (Unit & Property Fuzzing)
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Run Empirical Benchmark Suite Smoke Test
        run: |
          python benchmarks/benchmark_suite.py

      - name: Verify Package Build
        run: |
          python -m build

  native-wheels:
    name: Native wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build sdist + wheels for all supported Pythons
        uses: PyO3/maturin-action@v1
        with:
          working-directory: caliper_core
          command: build
          args: --release --out dist --find-interpreter

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caliper-core-wheels-${{ matrix.os }}
          path: caliper_core/dist/*.whl
          if-no-files-found: error

  pypi-release:
    name: Publish caliper-core wheels to PyPI
    needs: [native-wheels, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no API token needed)
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*

