[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "caliper-core"
version = "1.0.0"
description = "High-performance native Rust core acceleration engine for Caliper Tokenizer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
sdist-include = ["Cargo.lock"]
